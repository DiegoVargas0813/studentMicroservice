spring.application.name=student-microservice
# Oracle Database Connection Settings using Wallet
spring.datasource.url=jdbc:oracle:thin:@studentdev_high?TNS_ADMIN=src/main/resources/Wallet_studentdev
spring.datasource.username=STUDENTMANAGER
spring.datasource.password=Spring-boot101
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
# Connection Pooling (Optional)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000